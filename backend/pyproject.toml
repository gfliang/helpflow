[project]
name = "helpflow-api"
version = "0.1.0"
description = "HelpFlow local development API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "bcrypt>=4.2,<5.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx[socks]>=0.28,<1.0",
  "PyJWT>=2.10,<3.0",
  "pgvector>=0.3,<1.0",
  "pypdf>=5.0,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "redis>=8.1.0",
  "langchain>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "langchain-text-splitters>=0.3,<1.0",
  "langgraph>=0.2,<1.0",
  "langgraph-checkpoint-postgres>=2.0,<3.0",
  "langfuse>=2.50,<4.0",
  "psycopg-pool>=3.2,<4.0",
  "fastembed>=0.4,<0.7",
  "onnxruntime==1.18.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
